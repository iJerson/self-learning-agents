<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Agent Comms</title>
<style>
  :root {
    --bg: #05070a;
    --panel: #0a0f16;
    --line: #1a2430;
    --text: #cfe8ff;
    --dim: #4a6070;
    --accent: #35e0ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "SF Mono", "Consolas", "Menlo", monospace;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
  #header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0b111a, #05070a);
  }
  #header h1 { font-size: 14px; letter-spacing: 0.12em; margin: 0; color: var(--accent); font-weight: 700; }
  #status { font-size: 11px; display: flex; align-items: center; gap: 8px; color: var(--dim); }
  #statusDot { width: 8px; height: 8px; border-radius: 50%; background: #ff4d5e; box-shadow: 0 0 6px #ff4d5e; }
  #statusDot.live { background: #2effa0; box-shadow: 0 0 8px #2effa0; }
  #main { flex: 1; display: flex; min-height: 0; }
  #canvasWrap { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #console {
    width: 420px; border-left: 1px solid var(--line);
    background: var(--panel); display: flex; flex-direction: column; min-height: 0;
  }
  #consoleHead {
    padding: 8px 12px; font-size: 10px; letter-spacing: 0.1em; color: var(--dim);
    border-bottom: 1px solid var(--line); text-transform: uppercase;
  }
  #log {
    flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 11.5px; line-height: 1.55;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .row { margin-bottom: 6px; opacity: 0; animation: fadeIn 0.4s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  .ts { color: var(--dim); }
  .path { color: var(--accent); }
  .st-done { color: #2effa0; }
  .st-failed { color: #ff4d5e; }
  .st-in_progress, .st-verifying { color: #ffcf4d; }
  .st-escalated { color: #ff9a4d; }
  .note { color: #9fb6c4; }
  #empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 12px; letter-spacing: 0.08em; text-align: center; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>AGENT COMMS</h1>
    <div id="status"><span id="statusDot"></span><span id="statusText">connecting…</span></div>
  </div>
  <div id="main">
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div id="empty">no active agents — waiting for the orchestrator to dispatch work</div>
    </div>
    <div id="console">
      <div id="consoleHead">agent_log.jsonl</div>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
const LOG_URL = 'agent_log.jsonl';
const POLL_MS = 1200;
const ROLE_COLORS = {
  orchestrator:   '#35e0ff',
  planner:        '#a06bff',
  developer:      '#ffbf47',
  tester:         '#2effa0',
  reviewer:       '#ff7ad1',
  'skill-reviewer': '#ff9a4d',
  ledger:         '#6f88a0',
};
function colorFor(name) {
  if (ROLE_COLORS[name]) return ROLE_COLORS[name];
  // stable fallback color from a hash of the name
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360}, 70%, 62%)`;
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const emptyEl = document.getElementById('empty');
const logEl = document.getElementById('log');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

let dpr = window.devicePixelRatio || 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  const r = canvas.parentElement.getBoundingClientRect();
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---- state -----------------------------------------------------------
const nodes = new Map();       // name -> {x,y,color,pulse}
let linesSeen = 0;
let lastEventAt = 0;
// activeEdges: key = task_id|worker  -> {from,to,taskId,worker,color,since}
const activeEdges = new Map();
// oneShotBeams: transient burst on a fresh event
let beams = [];

const HUB = 'orchestrator';
// Safety net: a dispatch without a matching terminal `result` event (a
// logging gap, not a code path we should assume is impossible) would
// otherwise leave its beam pulsing "active" forever, misrepresenting the
// team as still waiting on a worker that actually finished or was
// abandoned long ago. Auto-expire any edge that's gone this long with no
// update, rather than trusting the log to always close what it opens.
const STALE_EDGE_MS = 10 * 60 * 1000;

function ensureNode(name) {
  if (nodes.has(name)) return nodes.get(name);
  const n = { name, x: 0, y: 0, color: colorFor(name), glow: 0 };
  nodes.set(name, n);
  layoutNodes();
  return n;
}

function layoutNodes() {
  const r = canvas.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const others = [...nodes.keys()].filter(n => n !== HUB);
  const radius = Math.min(r.width, r.height) * 0.34;
  ensureNode(HUB).x = cx; ensureNode(HUB).y = cy;
  others.forEach((name, i) => {
    const angle = (i / others.length) * Math.PI * 2 - Math.PI / 2;
    const n = nodes.get(name);
    n.x = cx + Math.cos(angle) * radius;
    n.y = cy + Math.sin(angle) * radius;
  });
}

// Keyed by worker alone, not task_id+worker. Orchestrators routinely split,
// rename, or reuse task_ids across retries/reconciliation (observed in real
// logs: a narrower re-dispatch under a new task_id whose actual completion
// gets logged under the original task_id) — keying on task_id made an edge
// permanently unclosable whenever that happened, since the closing event's
// task_id never matched the one that opened it. A worker can only sensibly
// be "active" on one thing from this orchestrator's point of view anyway,
// so any terminal event from that worker closes whatever's currently open.
function edgeKey(worker) { return worker; }

function otherParty(ev) { return ev.from === HUB ? ev.to : ev.from; }

function isTerminal(ev) {
  // A "result" event means the worker replied — they're no longer actively
  // running, regardless of the outcome status (done/failed/verifying/escalated
  // are all real statuses this log uses on a closing result). The status only
  // affects the flash color, never whether the edge stays "active."
  if (ev.event === 'result') return true;
  if (ev.from === ev.to) return ev.status === 'done' || ev.status === 'failed';
  return false;
}

function applyEvent(ev) {
  ensureNode(ev.from);
  ensureNode(ev.to);
  lastEventAt = performance.now();

  const worker = otherParty(ev);
  const key = edgeKey(worker);

  // Self-referential events (from === to, e.g. "orchestrator" noting its own
  // progress) are internal bookkeeping, not real inter-agent communication —
  // never arm a beam for them, only log + flash the node. "ledger" is the
  // same story even though from/to differ ("orchestrator" -> "ledger"): it's
  // not a live agent that ever replies with its own "result" event, so
  // arming a real edge for it can never be closed the normal way and gets
  // permanently stuck. Treat any event touching "ledger" as bookkeeping too.
  const isSelfEvent = ev.from === ev.to || ev.from === 'ledger' || ev.to === 'ledger';
  if (!isSelfEvent && (ev.event === 'dispatch' || (ev.event === 'claim' && ev.status === 'in_progress'))) {
    activeEdges.set(key, { from: HUB, to: worker, taskId: ev.task_id, worker, color: colorFor(worker), since: performance.now() });
  }
  if (isTerminal(ev)) {
    activeEdges.delete(key);
    flashNode(worker, ev.status === 'failed' ? '#ff4d5e' : '#2effa0');
  }

  // one-shot beam for this specific event, direction from->to
  const a = nodes.get(ev.from), b = nodes.get(ev.to);
  if (a && b) {
    beams.push({
      x0: a.x, y0: a.y, x1: b.x, y1: b.y,
      color: statusColor(ev.status),
      t0: performance.now(), dur: 900,
    });
  }
  flashNode(ev.from, statusColor(ev.status));

  appendLog(ev);
}

function flashNode(name, color) {
  const n = nodes.get(name);
  if (n) { n.glow = 1; n.flashColor = color; }
}

function statusColor(status) {
  switch (status) {
    case 'done': return '#2effa0';
    case 'failed': return '#ff4d5e';
    case 'escalated': return '#ff9a4d';
    case 'verifying':
    case 'in_progress':
    default: return '#ffcf4d';
  }
}

function appendLog(ev) {
  const row = document.createElement('div');
  row.className = 'row';
  const time = ev.ts ? ev.ts.slice(11, 19) : '';
  row.innerHTML = `<span class="ts">${time}</span> ` +
    `<span class="path">${ev.from} → ${ev.to}</span> ` +
    `<span class="st-${ev.status}">[${ev.status}]</span><br>` +
    `<span class="note">${(ev.note || '').replace(/</g, '&lt;')}</span>`;
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
  // cap history so the DOM doesn't grow forever
  while (logEl.childElementCount > 400) logEl.removeChild(logEl.firstChild);
}

// ---- polling -----------------------------------------------------------
async function poll() {
  try {
    const res = await fetch(LOG_URL + '?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('http ' + res.status);
    const text = await res.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    if (lines.length > linesSeen) {
      const fresh = lines.slice(linesSeen);
      linesSeen = lines.length;
      for (const line of fresh) {
        try { applyEvent(JSON.parse(line)); } catch (e) { /* skip malformed line */ }
      }
    } else if (lines.length < linesSeen) {
      // file was truncated/rotated — resync from scratch
      linesSeen = 0;
      logEl.innerHTML = '';
      activeEdges.clear();
      for (const line of lines) {
        try { applyEvent(JSON.parse(line)); } catch (e) {}
      }
    }
    setLive(true);
  } catch (e) {
    setLive(false);
  } finally {
    setTimeout(poll, POLL_MS);
  }
}

function setLive(ok) {
  statusDot.classList.toggle('live', ok);
  statusText.textContent = ok ? 'live · polling agent_log.jsonl' : 'disconnected — is a local server running?';
}

// ---- render loop -----------------------------------------------------------
function draw(now) {
  requestAnimationFrame(draw);
  const r = canvas.getBoundingClientRect();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);

  for (const [key, edge] of activeEdges) {
    if (now - edge.since > STALE_EDGE_MS) activeEdges.delete(key);
  }

  emptyEl.style.display = (activeEdges.size === 0 && beams.length === 0) ? 'flex' : 'none';

  // dormant hub-spoke lines (very faint) so the topology is always legible
  ctx.lineWidth = 1;
  for (const n of nodes.values()) {
    if (n.name === HUB) continue;
    const hub = nodes.get(HUB);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.moveTo(hub.x, hub.y); ctx.lineTo(n.x, n.y); ctx.stroke();
  }

  // active edges: continuous pulsing beam per active (task, worker) pair
  for (const edge of activeEdges.values()) {
    const a = nodes.get(HUB), b = nodes.get(edge.worker);
    if (!a || !b) continue;
    const age = now - edge.since;
    ctx.strokeStyle = edge.color;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.globalAlpha = 1;

    // traveling pulse dot, looping every 1100ms
    const t = (age % 1100) / 1100;
    const px = a.x + (b.x - a.x) * t;
    const py = a.y + (b.y - a.y) * t;
    drawGlowDot(px, py, 5, edge.color);
  }

  // one-shot beams (fresh events)
  beams = beams.filter(bm => now - bm.t0 < bm.dur);
  for (const bm of beams) {
    const t = (now - bm.t0) / bm.dur;
    const px = bm.x0 + (bm.x1 - bm.x0) * t;
    const py = bm.y0 + (bm.y1 - bm.y0) * t;
    ctx.globalAlpha = 1 - t;
    drawGlowDot(px, py, 7, bm.color);
    ctx.globalAlpha = 1;
  }

  // nodes
  for (const n of nodes.values()) {
    const isHub = n.name === HUB;
    const isActive = isHub
      ? activeEdges.size > 0
      : [...activeEdges.values()].some(e => e.worker === n.name);

    if (n.glow > 0) n.glow = Math.max(0, n.glow - 0.005);

    const baseR = isHub ? 22 : 16;
    const glowColor = n.flashColor || n.color;

    if (isActive || n.glow > 0) {
      ctx.save();
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 18 + n.glow * 20;
      ctx.fillStyle = glowColor;
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(n.x, n.y, baseR, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#0e1621';
      ctx.strokeStyle = n.color;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, baseR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = isActive ? '#05070a' : n.color;
    ctx.font = (isHub ? '11px' : '10px') + ' monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (isActive) { ctx.fillStyle = '#05070a'; }
    ctx.fillText(shortLabel(n.name), n.x, n.y);

    ctx.fillStyle = '#7d94a6';
    ctx.font = '9px monospace';
    ctx.fillText(n.name, n.x, n.y + baseR + 12);
  }
}

function shortLabel(name) {
  const words = name.split('-');
  return words.map(w => w[0].toUpperCase()).join('').slice(0, 3);
}

function drawGlowDot(x, y, r, color) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// seed the hub so it's visible even with zero events yet
ensureNode(HUB);
requestAnimationFrame(draw);
poll();
</script>
</body>
</html>
